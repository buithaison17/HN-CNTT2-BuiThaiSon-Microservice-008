spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: organizer-service
              uri: lb://organizer-service
              predicates:
                - Path=/api/organizer/**
              filters:
                - StripPrefix=2

            - id: event-service
              uri: lb://event-service
              predicates:
                - Path=/api/event/**
              filters:
                - StripPrefix=2

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

