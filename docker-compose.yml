services:
  organizer-db:
    image: mysql:latest
    container_name: organizer-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=organizer_db
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - organizer_db:/var/lib/mysql

  event-db:
    image: mysql:latest
    container_name: event-db
    ports:
      - "3308:3306"
    environment:
      - MYSQL_DATABASE=event_db
      - MYSQL_ROOT_PASSWORD=123456
    volumes:
      - event_db:/var/lib/mysql

volumes:
  organizer_db:
  event_db:
